<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fruit Flow</title>
    <link rel="stylesheet" href="style.css?v=20251129e" />
  </head>
  <body>
    <div class="fm-wrapper">
      <!-- Leaderboards at very top -->
      <section class="fm-lb-wrap" aria-label="Leaderboards">
        <div class="fm-card">
          <div class="fm-card-head">
            <h3 class="fm-card-title">Global Leaderboard</h3>
            <button id="fm-lb-global-more" class="fm-btn fm-btn--sm" title="Show more">
              Show more
            </button>
          </div>
          <ol id="fm-lb-global" class="fm-lb"></ol>
        </div>
        <div class="fm-card">
          <div class="fm-card-head">
            <h3 class="fm-card-title">Daily Challenge Leaderboard</h3>
            <button id="fm-lb-daily-more" class="fm-btn fm-btn--sm" title="Show more">
              Show more
            </button>
          </div>
          <ol id="fm-lb-daily" class="fm-lb"></ol>
        </div>
      </section>
      <header class="fm-header">
        <h1 class="fm-title">🍓 Fruit Flow</h1>
        <div class="fm-stats">
          <span>Score: <span id="fm-score">0</span></span>
          <span>Moves: <span id="fm-moves">0</span></span>
          <button
            id="fm-daily"
            class="fm-btn"
            title="Play the daily board for selected date (no future dates)"
          >
            Daily
          </button>
          <input id="fm-daily-date" type="date" class="fm-date" />
          <button id="fm-global" class="fm-btn" title="Play a normal random board">Global</button>
          <button id="fm-new" class="fm-btn">New game</button>
        </div>
        <div class="fm-stats fm-stats--sub">
          <span id="fm-target-big" class="fm-target-big"></span>
          <button id="fm-hint" class="fm-btn" title="Show a possible merge (costs 300)">
            Hint (-300)
          </button>
          <button id="fm-lb-open" class="fm-btn fm-btn--sm" title="Open leaderboards">
            Leaderboards
          </button>
        </div>
      </header>

      <main>
        <h3 class="fm-section-title">Merge Order</h3>
        <div id="fm-merge-chart" class="fm-chart" aria-label="Merge chart"></div>
        <div id="fm-board" class="fm-board"></div>
        <!-- Game over / high score overlay -->
        <div
          id="fm-gameover"
          class="fm-gameover fm-hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="fm-gameover-title"
        >
          <div class="fm-gameover-inner">
            <h2 id="fm-gameover-title">Game Over</h2>
            <p id="fm-final-score"></p>
            <form id="fm-highscore-form" autocomplete="off">
              <label class="fm-go-label"
                >Name
                <input id="fm-player-name" type="text" maxlength="16" placeholder="Player" />
              </label>
              <button type="submit" class="fm-btn fm-go-save">Save score</button>
            </form>
            <button id="fm-restart-btn" class="fm-btn fm-go-restart">Play again</button>
            <div id="fm-highscores" class="fm-highscores" aria-label="High scores"></div>
          </div>
        </div>
        <!-- Confirm new game overlay (reuses gameover styles) -->
        <div
          id="fm-confirm"
          class="fm-gameover fm-hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="fm-confirm-title"
        >
          <div class="fm-gameover-inner">
            <h2 id="fm-confirm-title">Start a new game?</h2>
            <p id="fm-confirm-msg">
              Switching mode will start a new board and your current run will be lost.
            </p>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px">
              <button id="fm-confirm-cancel" class="fm-btn">Keep playing</button>
              <button id="fm-confirm-ok" class="fm-btn fm-go-restart">Start new game</button>
            </div>
          </div>
        </div>
        <!-- Leaderboards modal overlay -->
        <div
          id="fm-lb-modal"
          class="fm-gameover fm-hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="fm-lb-modal-title"
        >
          <div class="fm-gameover-inner" style="max-width: 560px">
            <h2 id="fm-lb-modal-title">Leaderboards</h2>
            <div class="fm-highscores" style="max-height: 320px">
              <h3>Global</h3>
              <ol id="fm-lb-modal-global" class="fm-lb"></ol>
              <h3 style="margin-top: 12px">Daily</h3>
              <ol id="fm-lb-modal-daily" class="fm-lb"></ol>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 12px; gap: 10px">
              <button id="fm-lb-close" class="fm-btn">Close</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="game.js?v=20251130b"></script>
  </body>
</html>
